name: cuotiva
description: "Cuotiva - Cada cuota cuenta. Control de cobros, cuotas y abonos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Base
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  loading_animation_widget: ^1.3.0
  animate_do: ^4.2.0
  url_launcher: ^6.3.2
  in_app_update: ^4.2.5
  package_info_plus: ^10.0.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  uuid: ^4.5.1

  # Datos locales (drift + SQLite)
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # Seguridad
  local_auth: ^2.3.0
  flutter_secure_storage: ^11.2.0

  # Notificaciones locales
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # PDF / compartir / adjuntos
  pdf: ^3.12.0
  printing: ^5.13.4
  share_plus: ^13.0.0
  image_picker: ^1.1.2
  crypto: ^3.0.8
  image: ^4.13.1
  sqlite3: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  drift_dev: ^2.34.0
  build_runner: ^2.4.13

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#6D28D9"
  adaptive_icon_foreground: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAF8FF"
  image: assets/images/logo.png
  color_dark: "#4C1D95"
  image_dark: assets/images/logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# Cifrado de la base de datos (Fase 4, ADR 0004): SQLCipher en vez de SQLite.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
